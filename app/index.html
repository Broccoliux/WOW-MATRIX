<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Matrix Controller - v2 Lookup</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>

  <div class="app-container">
    <header>
      <div class="header-title-wrap">
        <h1>Matrix Direct Controller</h1>
        <span id="connectionStatus" class="badge offline">Offline</span>
      </div>

      <div class="header-actions">
        <div class="panel-card compact-panel">
          <h3>Bulk Selection Actions</h3>
          <p id="selectedCount">Selected: 0 LEDs</p>

          <div class="color-picker-group">
            <label for="bulkColorPicker">Assign Color:</label>
            <input type="color" id="bulkColorPicker" value="#00ffcc">
          </div>
          <button id="applyBulkColorBtn" class="btn-primary" onclick="applyColorToSelected()">Apply to Selected</button>
        </div>
      </div>
    </header>

    <main class="workspace">
      <section class="table-section">
        <div class="search-bar-group">
          <input type="text" id="ledSearchInput" placeholder="Search LED index or coordinates (e.g., 15 or 1,2,3)..."
            oninput="filterLEDTable()">
        </div>
        <div class="table-container">
          <table id="ledTable">
            <thead>
              <tr>
                <th><input type="checkbox" id="selectAll" onclick="toggleSelectAll(this)"></th>
                <th>Index</th>
                <th>Coordinates (X, Y, Z)</th>
                <th>Current Color</th>
              </tr>
            </thead>
            <tbody id="ledTableBody">

            </tbody>
          </table>
        </div>
      </section>

      <section class="control-panel">
        <div class="panel-card">
          <h3>Global Modes</h3>
          <div class="button-grid">
            <button onclick="setMode('solid')">Solid Fill</button>
            <button onclick="setMode('animations')">Animations</button>
            <button onclick="clearMatrix()">Clear All</button>
          </div>
        </div>
      </section>

      <section class="viewport-section">
        <div id="matrix3DSpace" class="matrix-3d-space"></div>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>

</html>
